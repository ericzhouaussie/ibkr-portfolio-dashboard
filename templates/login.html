<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - IBKR Portfolio Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 120px auto;
      padding: 40px;
      background: #1e293b;
      border-radius: 12px;
      text-align: center;
      color: #f1f5f9;
    }
    .login-container h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .login-container .subtitle { color: #94a3b8; margin-bottom: 32px; font-size: 0.95rem; }
    .login-form input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .login-form input:focus { outline: none; border-color: #6366f1; }
    .login-form .btn { width: 100%; padding: 12px; font-size: 1rem; }
    .error { color: #ef4444; margin-top: 12px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>📈 IBKR Portfolio</h1>
    <p class="subtitle">策略分仓管理 · 可视化仪表盘</p>
    <form method="POST" class="login-form">
      <input type="password" name="password" placeholder="请输入访问密码" required autofocus>
      <button type="submit" class="btn btn-primary">登 录</button>
      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}
    </form>
  </div>
</body>
</html>
